name: بناء APK

# يدوي فقط: زر Run workflow في تبويب Actions
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adkar-apk-build
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
      KEYSTORE_ALIAS: adkar
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: تثبيت أدوات البناء (من lock file)
        working-directory: apk
        run: npm ci

      - name: تدقيق الاعتماديات (high/critical فقط)
        working-directory: apk
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: تجهيز ملفات الموقع
        run: |
          mkdir apk/www
          cp index.html apk/www/
          cp -r app apk/www/app
          cp favicon.ico apk/www/

      - name: توليد مشروع أندرويد
        working-directory: apk
        run: npx cap add android

      - name: توليد أيقونات أندرويد من الهوية
        working-directory: apk
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0d6a4d' --iconBackgroundColorDark '#0d6a4d' --splashBackgroundColor '#e7efe8' --splashBackgroundColorDark '#e7efe8'

      - name: التحقق من وجود مفتاح التوقيع
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEYSTORE_B64" ]; then
            echo "::error::الأسرار ANDROID_KEYSTORE و ANDROID_KEYSTORE_PASSWORD غير مضبوطة. أنشئ مفتاحاً محلياً (keytool) وأضفه للأسرار — راجع README. البناء موقوف لتجنب إنشاء مفتاح جديد."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > adkar.keystore
          if [ ! -s adkar.keystore ]; then
            echo "::error::فشل فك ترميز ANDROID_KEYSTORE (ملف فارغ)."
            exit 1
          fi
          # تحقق من alias وسلامة المفتاح دون طباعة أسرار
          keytool -list -keystore adkar.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEYSTORE_ALIAS" >/dev/null 2>&1 || {
            echo "::error::alias '$KEYSTORE_ALIAS' غير موجود في المفتاح أو كلمة المرور خاطئة."
            exit 1
          }
          echo "مفتاح التوقيع سليم (alias: $KEYSTORE_ALIAS)."

      - name: ضبط توقيع الإصدار ورقمه
        working-directory: apk
        env:
          VERSION_CODE: ${{ github.run_number * 10 + github.run_attempt }}
          VERSION_NAME: 1.${{ github.run_number }}.${{ github.run_attempt }}
        run: python3 sign-android.py

      - name: بناء APK موقّع
        run: chmod +x apk/android/gradlew && cd apk/android && ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/adkar.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: adkar

      - name: التحقق من توقيع APK
        run: |
          APK="apk/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::APK غير موجود أو فارغ."
            exit 1
          fi
          echo "SHA-256: $(sha256sum "$APK" | cut -d' ' -f1)"
          # jarsigner يتحقق من توقيع v1؛ apksigner (إن توفر) يتحقق من v2/v3 أيضاً
          APSIGNER=$(find / -name apksigner -type f 2>/dev/null | head -n 1)
          if [ -n "$APSIGNER" ]; then
            "$APSIGNER" verify --verbose "$APK"
          else
            jarsigner -verify -verbose -certs "$APK" 2>&1 | tail -n 8
          fi

      - name: رفع APK
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: adkar-apk
          path: apk/android/app/build/outputs/apk/release/app-release.apk

      - name: تنظيف مفتاح التوقيع
        if: always()
        run: rm -f adkar.keystore
